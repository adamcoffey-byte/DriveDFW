<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DriveDFW</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">DFW</span>
      <div>
        <h1>DriveDFW</h1>
        <p class="tag">Metroplex trip companion</p>
      </div>
    </div>
    <p class="status" id="clock">—</p>
  </header>

  <main>
    <section class="hero card">
      <h2>Plan a trip</h2>
      <form id="trip-form">
        <label>From<input name="from" autocomplete="off" required /></label>
        <label>To<input name="to" placeholder="DFW Airport, downtown Fort Worth…" autocomplete="off" required /></label>
        <div class="row">
          <button type="submit">Build plan</button>
          <button type="button" class="ghost" id="maps-google">Google Maps</button>
          <button type="button" class="ghost" id="maps-apple">Apple Maps</button>
        </div>
      </form>
      <div id="plan" class="plan" hidden></div>
    </section>

    <section class="card">
      <h3>Destinations</h3>
      <div class="chips" id="chips"></div>
    </section>

    <section class="split">
      <article class="card">
        <h3>Saved trips</h3>
        <ul id="saved" class="list"></ul>
        <p class="hint" id="saved-empty">No saved trips yet.</p>
      </article>
      <article class="card">
        <h3>Heat + charge</h3>
        <ul id="heat" class="list"></ul>
      </article>
    </section>

    <section class="card">
      <h3>Corridors</h3>
      <div id="corridors" class="corridors"></div>
    </section>
  </main>

  <footer>
    <p>DriveDFW · adamcoffey-byte · local plans only — not live traffic</p>
  </footer>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
